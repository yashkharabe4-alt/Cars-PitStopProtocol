services:
  - type: web
    name: pit-stop-protocol
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: pit-stop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/pitstop.sqlite
      - key: RACE_DURATION_SECONDS
        value: "7200"
      - key: ADMIN_TOKEN
        generateValue: true
